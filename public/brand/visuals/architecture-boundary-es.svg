<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 -->
  <title id="title">Arquitectura antes que herramientas</title>
  <desc id="desc">El contexto operativo entra en un límite de sistema definido. Proceso, datos, decisiones y responsabilidad establecen la capacidad operacional que gobierna automatización, software e IA.</desc>
  <style>
    :root {
      --asset-accent: #CDBB9D;
      --asset-boundary: #6B7474;
      --asset-muted: #AEB4B0;
      --asset-label: #D5D9D6;
      --asset-rule: #475153;
      --asset-foreground: #F4F3EF;
      --asset-rule-subtle: #343E40;
      --asset-relationship: #596365;
      --asset-secondary: #D8DCDA;
      --asset-font: Manrope, Arial, sans-serif;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1l8 4-8 4z" fill="var(--asset-accent)"/>
    </marker>
  </defs>
  <g font-family="var(--asset-font)">
    <g fill="none" stroke="var(--asset-boundary)" stroke-width="1.5">
      <path d="M360 34v30" marker-end="url(#arrow)"/>
      <rect x="72" y="66" width="576" height="286"/>
    </g>
    <text x="360" y="22" fill="var(--asset-muted)" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">CONTEXTO OPERATIVO</text>
    <text x="96" y="99" fill="var(--asset-label)" font-size="11" font-weight="600" letter-spacing="1.6">LÍMITE DEL SISTEMA</text>
    <path d="M96 116h528" fill="none" stroke="var(--asset-rule)"/>
    <g font-size="18" font-weight="500" fill="var(--asset-foreground)">
      <text x="96" y="157">Proceso</text>
      <text x="96" y="211">Datos</text>
      <text x="96" y="265">Decisiones</text>
      <text x="96" y="319">Responsabilidad</text>
    </g>
    <g fill="none" stroke="var(--asset-rule-subtle)">
      <path d="M96 174h528"/>
      <path d="M96 228h528"/>
      <path d="M96 282h528"/>
    </g>
    <path d="M360 352v34" fill="none" stroke="var(--asset-accent)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="360" y="421" fill="var(--asset-foreground)" font-size="20" font-weight="700" text-anchor="middle">Capacidad operacional</text>
    <g fill="none" stroke="var(--asset-relationship)">
      <path d="M360 438v22"/>
      <path d="M164 460h392"/>
      <path d="M164 460v17"/>
      <path d="M360 460v17"/>
      <path d="M556 460v17"/>
    </g>
    <g fill="var(--asset-secondary)" font-size="14" font-weight="500" text-anchor="middle">
      <text x="164" y="500">Automatización</text>
      <text x="360" y="500">Software</text>
      <text x="556" y="500">IA</text>
    </g>
  </g>
</svg>
